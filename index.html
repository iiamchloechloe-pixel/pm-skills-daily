<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf2f8;--bg-card:#ffffff;--bg-card-hover:#fff5f9;--bg-elevated:#fef7fb;
  --border:#f9e0ec;--border-light:#f3c7db;
  --text:#3d2e3a;--text-secondary:#7a6373;--text-muted:#b09aa7;
  --amber:#e25d8f;--amber-soft:rgba(226,93,143,0.08);--amber-glow:rgba(226,93,143,0.04);
  --traditional:#7c6ce6;--traditional-soft:rgba(124,108,230,0.08);
  --ai:#e25d8f;--ai-soft:rgba(226,93,143,0.08);
  --success:#34c77b;--success-soft:rgba(52,199,123,0.08);
  --heart:#e25d8f;--heart-soft:rgba(226,93,143,0.08);
  --radius:12px;--radius-lg:16px;
  --font-display:Georgia,'Noto Serif SC',serif;
  --font-body:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;
  --shadow:0 4px 24px rgba(226,93,143,0.08);
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

/* Layout */
.app{max-width:720px;margin:0 auto;padding:24px 20px 120px}

/* Header */
.header{text-align:center;padding:48px 0 40px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:1px;background:var(--amber);opacity:0.5}
.header-date{font-family:var(--font-body);font-size:0.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:16px;font-weight:500}
.header-title{font-family:var(--font-display);font-size:2rem;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:8px}
.header-sub{font-size:0.85rem;color:var(--text-secondary);font-weight:300;letter-spacing:0.5px}

/* Progress Bar */
.progress-section{margin:32px 0;padding:20px 24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.progress-label{font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);font-weight:500}
.progress-count{font-size:0.85rem;color:var(--amber);font-weight:600;font-family:var(--font-display)}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),#e8c06a);border-radius:2px;transition:width 0.8s cubic-bezier(0.16,1,0.3,1)}

/* Navigation Tabs */
.nav{display:flex;gap:4px;margin:32px 0 24px;padding:4px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border)}
.nav-btn{flex:1;padding:10px 0;background:none;border:none;color:var(--text-muted);font-family:var(--font-body);font-size:0.8rem;font-weight:500;cursor:pointer;border-radius:8px;transition:all 0.3s;letter-spacing:0.5px}
.nav-btn.active{background:var(--bg-elevated);color:var(--text);box-shadow:0 1px 4px rgba(226,93,143,0.1)}
.nav-btn:hover:not(.active){color:var(--text-secondary)}

/* Skill Card (Main) */
.skill-hero{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;margin-bottom:24px;position:relative;overflow:hidden;transition:border-color 0.3s;box-shadow:0 2px 16px rgba(226,93,143,0.06)}
.skill-hero:hover{border-color:var(--border-light);box-shadow:0 4px 24px rgba(226,93,143,0.1)}
.skill-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:0.4}
.skill-meta{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tag{font-size:0.65rem;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:20px;font-weight:600}
.tag-traditional{background:var(--traditional-soft);color:var(--traditional)}
.tag-ai{background:var(--ai-soft);color:var(--ai)}
.tag-number{background:var(--amber-soft);color:var(--amber)}
.skill-hero-title{font-family:var(--font-display);font-size:1.75rem;font-weight:700;line-height:1.35;margin-bottom:6px}
.skill-hero-en{font-size:0.8rem;color:var(--text-muted);font-weight:400;margin-bottom:20px;font-style:italic}
.skill-hero-desc{font-size:0.95rem;color:var(--text-secondary);line-height:1.8;margin-bottom:24px}

/* Key Points */
.section-label{font-size:0.65rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--amber);margin-bottom:16px;font-weight:600}
.key-points{list-style:none;margin-bottom:24px}
.key-point{padding:12px 16px;margin-bottom:8px;background:var(--amber-glow);border-left:2px solid var(--amber);border-radius:0 8px 8px 0;font-size:0.88rem;color:var(--text);line-height:1.7}
.key-point strong{color:var(--amber);font-weight:600}

/* Case Study */
.case-study{background:var(--bg-elevated);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;border:1px solid var(--border)}
.case-title{font-size:0.78rem;color:var(--text-secondary);margin-bottom:10px;font-weight:500;display:flex;align-items:center;gap:8px}
.case-title svg{width:14px;height:14px;color:var(--amber)}
.case-text{font-size:0.88rem;color:var(--text-secondary);line-height:1.8}

/* Action Buttons */
.actions{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;padding:14px 20px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-family:var(--font-body);font-size:0.8rem;font-weight:500;cursor:pointer;border-radius:var(--radius);transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.3px}
.btn:hover{border-color:var(--border-light);color:var(--text);background:var(--bg-card-hover)}
.btn svg{width:16px;height:16px}
.btn-learned{border-color:rgba(74,222,128,0.3);color:var(--success);background:var(--success-soft)}
.btn-learned:hover{border-color:rgba(74,222,128,0.5)}
.btn-fav{border-color:rgba(244,114,182,0.3);color:var(--heart);background:var(--heart-soft)}
.btn-fav:hover{border-color:rgba(244,114,182,0.5)}

/* Skill List */
.skill-list{display:flex;flex-direction:column;gap:8px}
.skill-list-item{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all 0.3s}
.skill-list-item:hover{border-color:var(--border-light);background:var(--bg-card-hover)}
.skill-list-item.viewed{opacity:0.5}
.skill-list-num{font-family:var(--font-display);font-size:0.85rem;color:var(--text-muted);min-width:28px;font-weight:600}
.skill-list-info{flex:1;min-width:0}
.skill-list-title{font-size:0.9rem;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-list-en{font-size:0.72rem;color:var(--text-muted);font-style:italic}
.skill-list-badge{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.badge-traditional{background:var(--traditional)}
.badge-ai{background:var(--ai)}
.skill-list-check{color:var(--success);flex-shrink:0}
.skill-list-check svg{width:16px;height:16px}

/* Filter */
.filter{display:flex;gap:6px;margin-bottom:20px}
.filter-btn{padding:6px 14px;border:1px solid var(--border);background:none;color:var(--text-muted);font-family:var(--font-body);font-size:0.72rem;cursor:pointer;border-radius:20px;transition:all 0.3s;letter-spacing:0.5px;font-weight:500}
.filter-btn.active{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.stat{text-align:center;padding:20px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
.stat-num{font-family:var(--font-display);font-size:1.5rem;color:var(--amber);font-weight:700;margin-bottom:4px}
.stat-label{font-size:0.7rem;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;font-weight:500}

/* Today indicator */
.today-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:var(--amber-soft);border-radius:20px;font-size:0.65rem;color:var(--amber);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:20px}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Resources */
.resources{margin-top:20px;padding:16px 20px;background:var(--bg-elevated);border-radius:var(--radius);border:1px solid var(--border)}
.resources ul{list-style:none;margin-top:12px}
.resources li{padding:6px 0;font-size:0.82rem;color:var(--text-secondary);display:flex;align-items:flex-start;gap:8px}
.resources li::before{content:'→';color:var(--amber);flex-shrink:0;margin-top:1px}

/* Streak */
.streak{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:0.78rem;color:var(--text-muted)}
.streak-fire{font-size:1rem}

/* Responsive */
@media(max-width:480px){
  .app{padding:16px 16px 100px}
  .header-title{font-size:1.6rem}
  .skill-hero{padding:24px}
  .skill-hero-title{font-size:1.4rem}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
}

/* Fade in animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards}
.fade-up-d1{animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;opacity:0}
.fade-up-d2{animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;opacity:0}
.fade-up-d3{animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;opacity:0}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-icon{font-size:2rem;margin-bottom:12px;opacity:0.4}
.empty-text{font-size:0.85rem}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {

// ─── SKILLS DATA ────────────────────────────────────────────────
const SKILLS = [{
  id: 'user-story-mapping',
  category: 'traditional',
  title: '用户故事地图',
  en: 'User Story Mapping',
  desc: '用户故事地图是一种可视化工具，帮助团队从用户视角理解产品功能。它将用户活动按时间线排列在横轴，纵轴按优先级排列用户故事，从而形成一张完整的产品功能全景图。与传统需求列表不同，故事地图保留了用户使用场景的上下文，避免团队迷失在孤立的功能点中。',
  points: ['<strong>横轴=用户旅程</strong>：按时间顺序排列用户的关键活动，形成完整叙事线', '<strong>纵轴=优先级</strong>：每个活动下的故事从上到下由"必须有"到"可以没有"', '<strong>切片发布</strong>：横向画一条线，线以上的就是第一个版本（MVP）的功能范围', '<strong>协作工具</strong>：用便利贴在白墙上做是最有效的方式，远程可用 Miro/FigJam'],
  case: 'Spotify 用故事地图设计新用户引导流程：横轴是"注册→选兴趣→首次播放→创建歌单→邀请好友"，每个活动下纵向列出不同深度的功能。第一条切片线确定了最小体验：只需注册、选兴趣、自动播放一首歌，就完成了 MVP 验证。',
  resources: ['《User Story Mapping》Jeff Patton — 故事地图方法论的奠基之作', 'Miro 故事地图模板 — 在线协作的最佳实践', '实践中建议先用纸笔原型，再数字化']
}, {
  id: 'rice-framework',
  category: 'traditional',
  title: 'RICE 优先级框架',
  en: 'RICE Prioritization Framework',
  desc: 'RICE 是 Intercom 团队提出的优先级评分模型，通过四个维度量化需求优先级，减少"拍脑袋"决策。它特别适合功能需求多、资源有限时的取舍决策，让团队能用数据说服利益相关者，而不是靠嗓门大小。',
  points: ['<strong>Reach（覆盖面）</strong>：预估每季度有多少用户会接触到这个功能', '<strong>Impact（影响力）</strong>：对单个用户的影响程度，3=巨大 2=高 1=中 0.5=低 0.25=极低', '<strong>Confidence（信心度）</strong>：你对以上估算的信心，100%/80%/50%，避免过度乐观', '<strong>Effort（工作量）</strong>：以"人月"为单位的开发成本，越低越好'],
  case: '公式：Score = (Reach × Impact × Confidence) / Effort。假设功能A预计影响1000用户/季，影响力2，信心80%，需要3人月：Score = (1000×2×0.8)/3 = 533。功能B影响500用户，影响力3，信心100%，需5人月：Score = (500×3×1)/5 = 300。虽然B影响力更大，但A的综合优先级更高。',
  resources: ['Intercom 官方博客：RICE Framework 原文', '配合 Roadmap 工具（如 Productboard）使用效果更佳', '每季度回顾评分，用实际数据校准估算模型']
}, {
  id: 'prd-writing',
  category: 'traditional',
  title: 'PRD 文档编写',
  en: 'Product Requirements Document',
  desc: 'PRD 是产品经理最核心的输出物之一，是连接业务需求和技术实现的桥梁。好的 PRD 不是面面俱到的功能说明书，而是能让工程师、设计师、QA 在不问你问题的情况下理解"做什么"和"为什么做"的清晰文档。',
  points: ['<strong>背景与目标</strong>：为什么要做？解决什么问题？成功的衡量标准是什么？', '<strong>用户故事与场景</strong>：用"作为…我希望…以便…"格式描述，附带真实使用场景', '<strong>功能范围</strong>：明确 In Scope 和 Out of Scope，防止范围蔓延', '<strong>交互说明</strong>：用原型+文字说明每种状态，尤其是异常状态和边界条件'],
  case: '写搜索功能的PRD：不要只写"用户可以搜索商品"。要写：搜索框位置、placeholder文字、输入几个字触发联想、联想结果排序规则、无结果时展示什么、搜索历史存储几条、网络错误时的降级方案。每一个"然后呢？"都应该在PRD里找到答案。',
  resources: ['《Inspired》Marty Cagan — 产品发现与PRD的最佳实践', 'Notion/飞书 PRD 模板库 — 找到适合自己团队的模板', 'PRD 是活文档，发布后持续更新比写完更重要']
}, {
  id: 'user-interview',
  category: 'traditional',
  title: '用户访谈技巧',
  en: 'User Interview Techniques',
  desc: '用户访谈是产品发现阶段最重要的技能之一。但大多数产品经理做不好访谈——要么问引导性问题，要么把访谈变成了需求确认会。真正的访谈是倾听的艺术，目标是发现用户未被满足的需求，而不是验证你已有的假设。',
  points: ['<strong>少问多听</strong>：理想比例是用户说80%你说20%。用"能举个例子吗？"引导深入', '<strong>问行为不问观点</strong>：问"上次你怎么做"而不是"你觉得怎样"——人们说的和做的往往不同', '<strong>5 Whys 追问法</strong>：对每个回答追问"为什么"，挖到真正的底层需求', '<strong>避免引导</strong>：不要问"你是不是觉得很难用？"而是"跟我说说你上次使用的体验"'],
  case: 'Dropbox 早期发现用户不愿意推荐给同事，团队以为是推荐奖励不够。深度访谈后发现：用户不是不想推荐，而是不知道怎么向同事解释 Dropbox 是什么。解决方案不是加大奖励，而是做了那个著名的1分钟演示视频，注册量一夜从5000涨到75000。',
  resources: ['《The Mom Test》Rob Fitzpatrick — 访谈方法论经典', '记录访谈时用录音+笔记双保险，事后转录分析', '每次访谈后写"我学到了什么"而不是"用户说了什么"']
}, {
  id: 'competitive-analysis',
  category: 'traditional',
  title: '竞品分析框架',
  en: 'Competitive Analysis Framework',
  desc: '竞品分析不是列一个功能对比表格然后说"别人有的我们也要有"。好的竞品分析要回答三个问题：竞争格局是什么？对手的战略意图是什么？我们的差异化机会在哪里？它是为了做出更好决策，而不是为抄袭找依据。',
  points: ['<strong>直接/间接/替代竞品</strong>：直接做同样事的、解决同一需求不同方式的、抢用户时间/预算的', '<strong>分析维度</strong>：产品功能、定价策略、目标用户、增长渠道、用户口碑（App Store/社媒评论）', '<strong>SWOT + 差异化</strong>：不只看竞品做了什么，更看他们没做什么、做不好的是什么', '<strong>持续监控</strong>：用 Google Alerts、SimilarWeb、App Annie 建立竞品动态感知系统'],
  case: '当 Zoom 进入视频会议市场时，Skype 和 WebEx 是主要竞品。Zoom 没有用功能堆叠来竞争，而是聚焦"简单+稳定"这一个点：一键入会、不卡顿。它发现竞品们都在堆企业级功能，但忽略了最基础的使用体验。这就是从竞品分析中找到的差异化机会。',
  resources: ['Crayon.co — 专业竞品情报收集平台', '每季度做一次深度竞品分析，每月做一次动态更新', '把竞品分析结论转化为具体的行动计划，否则白做']
}, {
  id: 'okr-setting',
  category: 'traditional',
  title: 'OKR 制定与拆解',
  en: 'OKR Setting & Cascading',
  desc: 'OKR（Objectives and Key Results）是目标管理框架，但很多团队把它做成了KPI换了个名字。真正的OKR应该是有野心的、透明的、与公司战略对齐的。产品经理需要能自下而上提出产品OKR，也要能将公司级OKR拆解为可执行的产品策略。',
  points: ['<strong>O（目标）</strong>：定性、鼓舞人心、有方向感。"让用户爱上我们的搜索体验"', '<strong>KR（关键结果）</strong>：定量、可衡量、有截止日。"搜索成功率从60%提升到85%"', '<strong>对齐而非拆解</strong>：不是把上级KR机械拆给下级，而是各层基于上级方向自主制定', '<strong>0.7分=成功</strong>：如果所有OKR都是1.0说明目标不够有野心，0.6-0.7才是健康区'],
  case: 'Google 的经典OKR示例：O="打造最快乐的浏览器用户"。KR1="Chrome 市场份额达到20%"（当前8%）。KR3="一周内回访率达50%"。注意KR不是"开发3个新功能"这种产出指标，而是"市场份额"这种结果指标——这才叫Key Results。',
  resources: ['《Measure What Matters》John Doerr — OKR 方法论创始人著作', 'Weekdone/Tability — OKR 追踪工具', '每季度OKR周期：前2周制定，每周check-in，季度末评分复盘']
}, {
  id: 'metrics-system',
  category: 'traditional',
  title: '数据指标体系搭建',
  en: 'Metrics Framework Design',
  desc: '数据驱动不是看一堆数字就叫数据驱动。很多产品经理的Dashboard有上百个指标，但说不清业务到底健不健康。好的指标体系是有层次的：一个北极星指标统领全局，下面按用户旅程拆解为可操作的子指标，每个团队负责自己能影响的那一层。',
  points: ['<strong>北极星指标</strong>：最能体现用户获得价值的单一指标。如Airbnb的"预订间夜数"', '<strong>领先 vs 滞后指标</strong>：收入是滞后的，日活/留存是领先的——领先指标能预测未来', '<strong>比率比绝对值好</strong>："转化率"比"转化人数"更有决策价值，因为它消除了基数影响', '<strong>HEART 框架</strong>：Google 提出的用户体验指标体系——Happiness/Engagement/Adoption/Retention/Task success'],
  case: 'Spotify 的北极星指标是"用户收听时长"而不是"注册用户数"。因为收听时长最能反映用户是否获得了音乐价值。围绕它拆解：新用户→首周播放次数→创建歌单率→每周活跃天数。每个子指标都有对应团队负责，任何指标下滑都能快速定位到责任人。',
  resources: ['《Lean Analytics》Alistair Croll — 创业阶段的指标选择指南', 'Amplitude/Mixpanel — 产品分析工具', '指标不是越多越好，每个团队核心关注不超过5个']
}, {
  id: 'ab-testing',
  category: 'traditional',
  title: 'A/B 测试设计',
  en: 'A/B Testing Design',
  desc: 'A/B 测试是验证产品假设的科学方法，但很多团队做错了——要么样本不够就下结论，要么测试了按钮颜色却忽略了它可能毫无意义。好的A/B测试要从明确的假设开始，确保统计显著性，并且测试那些真正能影响业务指标的变量。',

  case: 'Booking.com 是A/B测试的极端实践者——同时运行上千个实验。但他们犯过的经典错误：测试"显示用户评价"功能时，短期指标提升但长期导致高端酒店评分被拉低，因为高端酒店用户更挑剔。教训：短期实验无法完全捕捉长期影响，要结合业务判断。',
  resources: ['《Trustworthy Online Controlled Experiments》Ronny Kohavi — A/B测试圣经', 'Evan Miller 的样本量计算器（evanmiller.org）', '永远不要提前结束测试——"偷看"结果会导致假阳性']
}, {
  id: 'prioritization',
  category: 'traditional',
  title: '需求优先级排序',

// ─── HELPERS ────────────────────────────────────────────────
function getDayIndex() {
  const now = new Date();
  const start = new Date(2024, 0, 1);
  return Math.floor((now - start) / 86400000);
}
function formatDate() {
  const d = new Date();
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('pm-skills-state') || '{}');
    return {
      learned: s.learned || [],
      favorites: s.favorites || [],
      streak: s.streak || 0,
      lastDate: s.lastDate || ''
    };
  } catch {
    return {
      learned: [],
      favorites: [],
      streak: 0,
      lastDate: ''
    };
  }
}
function saveState(state) {
  localStorage.setItem('pm-skills-state', JSON.stringify(state));
}
